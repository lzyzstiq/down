name: Download and Send APK via Email

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from GitHub Release
        run: |
          wget -O MakeACopy.apk \
            https://github.com/egdels/makeacopy/releases/download/v4.0.0/MakeACopy-v4.0.0-arm64-v8a-paddle-release.apk

      - name: Send email with attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.139.com
          server_port: 465
          username: lzyzstiq@139.com
          password: "6018467e0897385c8400"
          subject: "MakeACopy APK - v4.0.0"
          to: lzyzstiq@139.com
          from: lzyzstiq@139.com
          body: |
            Hello,
            This is the requested MakeACopy APK for ARM64-v8a (Paddle edition).
            Please find the attachment.
          attachments: MakeACopy.apk
          secure: true
          # 如果仍然遇到 ECONNRESET，可以尝试取消注释以下 nodemailer_options 来强制 TLS 1.2
          # nodemailer_options: |
          #   {
          #     "host": "smtp.139.com",
          #     "port": 465,
          #     "secure": true,
          #     "tls": { "minVersion": "TLSv1.2", "maxVersion": "TLSv1.2" }
          #   }
